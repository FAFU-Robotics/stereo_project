# =============================================================================
#  stereo_project 主配置文件
#  ---------------------------------------------------------------------------
#  设计原则：
#    1) 所有"可调参数"集中在这里，代码里不硬编码摄像头索引、分辨率、路径。
#    2) 临时参数（未标定）与正式标定参数严格分开存放，绝不混用：
#         - calibration.calibrated = false 时，程序一律使用 depth.temp 下的临时值
#         - 使用临时值产生的深度/点云一律标注"未标定，仅用于流程验证"
#    3) 带 【待确认】【待实测】 标记的项，必须由实测或厂家确认后填写，不允许猜。
# =============================================================================

project:
  name: stereo_project
  # 官方 Fast-FoundationStereo 源码位置（相对项目根目录）
  # 注意：保持官方目录结构原样，不要为了"目录整齐"而搬动其中的文件
  ffs_repo: third_party/Fast-FoundationStereo
  output_dir: output
  weights_dir: weights
  calibration_dir: calibration

# =============================================================================
# 相机
# =============================================================================
camera:
  # 采集模式，二选一：
  #   side_by_side —— 一个 USB 设备输出"左右拼接"画面（左右眼在同一幅图里）
  #   dual         —— 两个独立 UVC 设备，各占一个 OpenCV 索引
  #
  # 【2026-10-21 复核（见 docs/阶段1_相机权限复核_2026-10-21.md）】
  #   索引映射（DirectShow 枚举复核，未变）：
  #       0 = HP True Vision FHD Camera   （笔记本内置物理相机，4:3）
  #       1 = USB Camera (0BDA:5883)      （DECXIN 双目相机，8:3 左右拼接）
  #       2 = OMEN Cam ＆ Voice            （HP 的**软件虚拟摄像头**，640x480 全黑，永远不要用）
  #
  #   DECXIN（索引 1）的真实能力清单（驱动直接声明，MJPG 与 YUY2 各一套）：
  #       2560x960 / 2048x768 / 2560x720 / 1920x540 / 1600x600 / 1280x480 / 640x240
  #       —— 全部是 8:3 超宽比例，即"左右拼接"布局：1280x480 = 2 x 640x480（每只眼 640x480）
  #       —— 它**不提供** 640x480 这类单幅分辨率，之前请求 640x480 是错的
  #
  #   ✅ 普通用户权限（Medium 完整性）即可打开索引 1：
  #       实测 1280x480、左右各 640x480、10 帧 0 读取失败、close() 正常释放。
  #   ⚠️ 只有"低完整性 / 沙箱 / 受限会话"里的进程才可能被 Windows 拒绝
  #       （E_ACCESSDENIED）。这不是"普通用户 vs 管理员"的区别；
  #       不需要管理员权限，也不需要 tools\启动_管理员.bat。
  #   ⚠️ 索引 2 在普通权限下 isOpened()=True、read()=True，但画面全黑。
  #       它只能证明"虚拟摄像头能开"，不能证明双目相机可用 —— 不要用它做验收测试。
  #   ⚠️ 若普通 PowerShell 里仍打不开，先查 Python 本身的文件完整性标签：
  #       icacls "D:\31931\Documents\python312\python.exe" | findstr /I "Mandatory"
  #       应为 Medium；若为 Low（DSH 工作区会继承 Low）：
  #       icacls "D:\31931\Documents\python312\python.exe" /setintegritylevel Medium
  #       2026-10-22 实测：这是本机"必须管理员"的真正原因。
  mode: side_by_side

  # ---- side_by_side 模式参数 ----
  single_index: 1          # 实测 = DECXIN 双目相机（不是 2；2 是 HP 虚拟摄像头）
  split: left_right        # left_right = 左半幅是左眼；right_left = 反之（2026-10-21 图像复核通过）
  eye_width: 0             # 每只眼的有效宽度；0 = 自动对半切（1280/2 = 640）

  # ---- dual 模式参数（本机不适用：只有一个物理双目设备）----
  left_index: 0            # 笔记本内置相机（仅作对照/单目调试用）
  right_index: 1           # DECXIN

  # ---- 通用采集参数 ----
  backend: dshow           # dshow / msmf / any（实测 msmf 在本机无法按索引打开，用 dshow）
  backend_fallbacks: [dshow, msmf, any]  # 主后端失败时依次回退（dshow 是唯一可靠后端）
  open_with_params: true   # 打开时直接传分辨率/格式（对 UVC 比"打开后 set"更可靠）
  open_retry: 2            # 打开失败重试轮数
  open_retry_delay_s: 0.35 # 每轮重试间隔（秒）
  verify_size: true        # 实际尺寸 != 请求尺寸时直接报错，防止静默降级后跑错标定
  min_aspect_ratio: 2.0    # 左右拼接画面的最小宽高比；本机 1280x480=2.67；0=不检查
  auto_detect: false       # true = 扫描索引自动找 8:3 双目设备（single_index 也可写 auto）
  scan_max_index: 5        # auto_detect 的扫描范围 0..N
  # 主界面起来后在后台打开左右相机（side_by_side 仍是一个 USB 设备，左右眼一起开）。
  # 开始串流时如果这里已经成功，就不再重新打开、不再重做曝光预热。
  auto_open: true
  # 热插拔：用系统设备列表看相机还在不在，不调用 pnputil（那一跳太慢，不适合几百毫秒轮询）。
  hotplug_watch: true
  hotplug_interval_s: 0.4
  # 实例 ID 里包含这段文字才算「我们的相机」。
  # 本机 DECXIN 是 0BDA:5883。写上之后，串流中拔掉这只双目会立刻停流并释放句柄；
  # 拔掉笔记本自带摄像头不会误伤。再插上时主界面会重新打开左右相机。
  usb_match: "VID_0BDA&PID_5883"
  left_usb: ""             # dual 模式可选。写了就能在只拔掉一路时只关那一路
  right_usb: ""
  # OpenCV 读到的就是 BGR。这里必须是 bgr。
  # 设成 rgb 会再交换一次红蓝：蓝封面变成橙色，木色桌面变成青色。
  color_order: bgr
  fourcc: MJPG             # 实测该相机常用 MJPG（2560x960@60 等）；YUY2 也支持
  width: 1280              # 实测支持：1280x480 = 左右各 640x480（FFS 的最佳输入尺寸）
  height: 480
  fps: 30                  # 请求帧率（驱动声明最高 60）
  warmup_frames: 15        # 打开后丢弃的前若干帧，等自动曝光/白平衡稳定
  read_retry: 3            # 单帧读取失败时的重试次数
  # 黑屏判定：平均灰度与标准差同时低于阈值 => 判定为黑屏（不静默当成正常画面）
  black_mean_threshold: 1.0
  black_std_threshold: 1.0
  # "无有效信号"判定（更宽）：驱动返回空缓冲/噪声时，灰度和标准差都会很小。
  # 本机 HP 虚拟摄像头（索引 2）就是 640x480、mean≈0、std≈1 的全黑画面；
  # 用这两个阈值能把它识别出来并报警，而不是把黑屏当成"环境暗"。
  no_signal_mean_threshold: 5.0
  no_signal_std_threshold: 12.0

# =============================================================================
# 深度（视差 -> 深度）
# =============================================================================
depth:
  # 【关键】标定状态开关。false = 未标定，只允许流程验证，禁止测量。
  # 2026-10-13：阶段 5 标定完成（双目 RMS 0.1246 px、校正后极线失准 0.07 px），
  #             正式启用标定参数。依据见 docs/阶段5_标定实测记录.md。
  calibrated: true

  # ---- 未标定阶段使用的临时参数（保留作为回退：把 calibrated 改回 false 即可）----
  temp:
    fx: 500.0              # 临时焦距（像素），纯粹占位，不是这台相机的真实值
    fy: 500.0
    cx: 320.0
    cy: 240.0
    baseline_m: 0.060      # 厂家标称 60 mm（=0.06 m）；实测基线为 64.891 mm，见标定文件
    source: "厂家口头标称 60mm + 占位内参；未经标定验证，禁止用于测量"

  # ---- 正式标定文件（阶段 5 生成）----
  calibration_file: calibration/stereo_calib.yaml

  # 运行时是否"先校正再推理"：
  #   true  = 每帧先用标定映射表把左右图去畸变+行对齐，再送 FFS（推荐，深度才准）
  #           此时深度用校正后的等效内参（P1：fx=547.02、基线 64.891 mm）
  #   代价：每帧多约 3~5 ms（当前 5 FPS，影响可忽略）
  #   false = 直接用原始图推理（快，但画面边缘误差明显更大，且畸变未消除）
  rectify_before_infer: true

  # 显示/导出用的深度范围（米）
  zmin_m: 0.15
  zmax_m: 3.00

  # 散斑过滤：丢弃面积小于该值（像素）的孤立有效区域。
  # 无纹理区域（墙面/光滑面/深色衣物）容易产生孤立的虚假近距离小斑块。
  # 实测效果：本机一帧真实数据里只影响 0.2% 像素（这类错误多为大片连通区域，
  # 而非小斑点），因此它只是一道便宜的安全网，不是主要手段。
  # 640x480 下 200 像素约为画面的 0.065%；设为 0 表示关闭过滤。
  min_speckle_size: 200

  # 视差外推值过滤：FFS 的搜索范围是 ffs.max_disp，超过该范围的视差是网络外推的，不可信。
  # 这里保留 disp <= ratio * max_disp 的像素。实测本机一帧数据里这类像素占 2.6%
  # （对应深度约 0.15 m，多数本来也会被 zmin 过滤）。设为 0 表示不过滤。
  disp_extrapolation_ratio: 0.98

  # ===========================================================================
  # 经验视差校正（2026-10-18 实测标定）：disp_corrected = disp * scale + offset
  # depth = fx*B / disp_corrected
  # ---------------------------------------------------------------------------
  # 为什么需要：FFS 网络输出的视差**系统性偏小**，导致所有深度整体偏大 ~2%。
  # 两个完全独立的方法互相印证：
  #   ① 视差 vs 理论视差（板子位姿给真值，344~348 mm 处）：
  #        实测/理论 = 0.9798 / 0.9809 -> 深度尺度 +2.06% / +1.95%（平均 +2.00%）
  #   ② 两台相机同一板坐标系下的点云对比：
  #        板面 z 偏移 +6.75 mm @ 341.8 mm = +1.97%
  # 两者相差 0.03 个百分点。
  # ---------------------------------------------------------------------------
  # 取 1.0221 的依据（2026-10-18 用 5 个已知距离样本拟合，见下）：
  #   每个样本 = 用板子② (5x7/36mm, 打印实测 35.983mm/格) 的位姿得到真实距离，
  #   再在板子角点处采样 FFS 实测视差：
  #     Z=344.2mm 实测 101.22px 理论 103.12px 比值 0.9816
  #     Z=344.2mm 实测 100.68px 理论 103.13px 比值 0.9762
  #     Z=345.1mm 实测 100.50px 理论 102.85px 比值 0.9771
  #     Z=347.7mm 实测  88.61px 理论  90.66px 比值 0.9774  (Z=391.5mm)
  #     Z=347.7mm 实测 100.00px 理论 102.10px 比值 0.9794
  #   单参数拟合 y = a*disp  =>  a = 1.02209 ± 0.00102, 残差 RMS 0.224 px
  #   两参数拟合 y = a*disp+b => b = 1.04 ± 2.29（与 0 无显著差别），
  #     且 a 的不确定度放大到 ±0.023（因为视差跨度只有 12.6 px，两参数强相关）
  #   => 结论：**纯比例**模型成立，取 a = 1.0221、b = 0
  #   预期残余误差：残差 0.224 px / 约 100 px ≈ 0.22%
  #   该结果与"两台相机点云对比"(+1.97%) 相互独立且一致（差 0.03 个百分点）
  # ---------------------------------------------------------------------------
  # 待完善：若要严格定出 offset，需要视差跨度 60+ px 的数据（如 0.22 m，
  #   但那里整块板会出画）。当前 b 不显著，暂不需要。
  # 回退：把 disp_scale 改回 1.0、disp_offset 改回 0.0 即恢复原行为。
  disp_scale: 1.0221
  disp_offset: 0.0

# =============================================================================
# 标定（阶段 5）
# -----------------------------------------------------------------------------
#  标定板：DFOPTIX Q12-50-3（光学白膜 + 玻璃基板）
#      方格 12 x 9、单格 3.0 mm → 图案 36 x 27 mm、内角点 11 x 8
#
#  【为什么工作距离只有 9~17 cm】2026-10-13 实测（tools\capture_calib.py --probe）：
#      10 cm: 每格 15.5 px, 清晰度 285, 对比度 149
#      12 cm: 每格 12.5 px, 清晰度 386, 对比度 158
#      15 cm: 每格 10.1 px, 清晰度 441, 对比度 161
#      18 cm 以上：每格 < 8 px → 角点检不到（板子太小）
#      结论：本机这颗定焦镜头近距离并不糊（清晰度 285~441，判据 >100 为良好），
#            限制因素是"图案在画面里的像素数"，不是对焦。
# =============================================================================
calibration:
  # ===========================================================================
  # 这里填的是【当前生效的那次标定】所用的板子：DFOPTIX Q12-50-3 玻璃板
  #   12x9 方格 / 方格 3.0 mm / 图案 36x27 mm / 内角点 11x8 = 88 个
  # 依据 calibration/stereo_calib.yaml 里的 meta（board / capture_dir）。
  # 采集目录：output/calib/20261013_151253（26 对，用启动器菜单 [12] 拍的）
  # 标定结果：基线 64.891 mm，单眼 RMS 0.073/0.153 px，双目 RMS 0.1246 px，
  #           校正后极线失准 0.07 px
  # ---------------------------------------------------------------------------
  # 关于另一张板（A4 打印 ChArUco 7x9 / 26 mm，标记 19 mm）：
  #   2026-10-18 用它试过一次重标（采集目录 output/calib/20261018_183346，26 对），
  #   结果明显更差：单眼 RMS 0.272 px、双目 RMS 0.379 px、校正后极线失准 12.8 px
  #   （还出现负视差，说明立体几何被解坏了）。原因是**打印纸不是刚性平面**，
  #   而玻璃板天然平整（这也是它 RMS 只有 0.073 px 的原因）。
  #   → **未采用**，结果另存 calibration/stereo_calib_v2_charuco26mm.yaml。
  #   若将来要用那张板重标：先把纸整面贴到亚克力/玻璃上压平，再把下面三个数改成
  #   board_cols: 7 / board_rows: 9 / square_mm: 26.0，并把距离改成 30~45 cm。
  # ---------------------------------------------------------------------------
  # 另注：标定只用棋盘内角点，ChArUco 标记的字典/布局不参与，无需关心 DICT5X5 子集
  # ===========================================================================
  board_cols: 12           # 方格列数（内角点 = 列-1 = 11）
  board_rows: 9            # 方格行数（内角点 = 行-1 = 8）-> 共 88 个内角点
  square_mm: 3.0           # 单格边长（毫米）—— 直接决定深度的绝对尺度
  # 注：实测表明这个名义 3.0 mm 基本是准的（换 26 mm 大板重标后基线只变 -0.28%），
  #     所以 2% 的深度偏差另有来源，已用 depth.disp_scale 经验校正修掉。
  distance_min_cm: 9       # 采集时建议的最近距离（板小，要贴近）
  distance_max_cm: 17      # 采集时建议的最远距离（更远每格 <8 px 就检不到）
  target_frames: 26        # 目标采集对数（板小，用数量补信息量）
  min_px_per_square: 8.0   # 每格最少像素（低于此角点定位误差明显变大）
  min_sharpness: 100.0     # 清晰度下限
  min_contrast: 120.0      # 图案最差区域对比度下限
  # 采集时的姿态清单（每类至少拍几张），用于实时进度提示
  checklist:
    中心正对: 2
    左上角: 2
    右上角: 2
    左下角: 2
    右下角: 2
    左倾大于20度: 3
    右倾大于20度: 3
    上仰大于20度: 3
    下俯大于20度: 3

# =============================================================================
# Fast-FoundationStereo（FFS）
# =============================================================================
ffs:
  weights_dir: weights/23-36-37
  # 官方研究版 checkpoint 文件名（下载后放在 weights_dir 下）
  # 同目录还必须要有官方自带的 cfg.yaml（官方脚本/本项目都会读它）
  # 实测该 cfg.yaml 内容：max_disp=416, valid_iters=8, mixed_precision=true,
  #                       corr_levels=2, corr_radius=4, n_gru_layers=1,
  #                       hidden_dims=[128], vit_size=vitl, low_memory=0
  model_file: model_best_bp2_serialize.pth
  # 每次推理的迭代次数：越小越快、精度略降（官方表：8 -> 49.4ms / 4 -> 41.1ms @3090）
  # 界面预设会覆盖下面两个数。默认平衡档：0.75 / 8。
  # 精确档（1.0/8）已从界面移除，见 session.PRESETS 的注释。
  preset: balanced
  valid_iters: 8
  # 最大视差，单位是模型输入像素。平衡档 0.15 m 处约 178 px，192 够用。
  # 再加大搜索范围只会让无纹理区域更容易匹配到很近的错误视差。
  max_disp: 192
  # 模型宽度 / 标定图宽度。平衡档 0.75。内参按这个比例缩放，不用重新标定。
  scale: 0.75

  # =========================================================================
  # 阶段 7.3 实测的「速度 ↔ 精度」三档（数据来源 tools/bench_presets.py + bench_pipeline.py）
  # 精度样本：5 组已知真实距离（0.344~0.392 m，ChArUco 板位姿给真值）
  #
  #   档位   scale  valid_iters   推理     三线程FPS   平均误差  最大误差
  #   精确    1.0       8        159 ms     6.21       0.18%    0.32%
  #   平衡   0.75       8         95 ms    10.31       0.19%    0.30%
  #   快速    0.5       4         47 ms    20.55       0.19%    0.38%
  #
  # 结论：在这批"平面/大目标"样本上三档深度精度几乎一样（±0.2%），
  #       所以 0.5 档性价比最高（快 3.3 倍）。
  # ⚠️ 0.5 档的代价不是"距离精度"而是**空间分辨率**：输出尺寸减半，
  #    细边缘/细小物体/薄结构轮廓会变粗，低纹理区域更易失配。看细节用 0.75 或 1.0。
  # 当前默认改成 scale=1.0、valid_iters=4：在标定分辨率上推理，迭代次数仍用快速档。
  # 界面若再选「快速」，会回到 0.5，近处搜索范围和速度都恢复原样。
  #
  # 切换：改下面两个数即可（命令行也能临时覆盖 --scale / --valid-iters）
  #   平衡: scale: 0.75  valid_iters: 8
  #   快速: scale: 0.5   valid_iters: 4
  # =========================================================================
  # 是否使用官方分层推理（hierachical）
  hiera: 0
  # 代价体构建后端：
  #   pytorch1 —— 纯 PyTorch，Windows 可用（不需要 Triton）
  #   triton   —— 需要 Triton，Windows 官方 PyTorch 不带，暂不使用
  build_volume: pytorch1
  # Windows 上没有 Triton，torch.compile 无法编译 CUDA 内核，必须禁用 dynamo
  disable_torch_compile: true
  # 是否去掉左右图非重叠区域（视差为负/越界）的深度
  remove_invisible: 1
  # 预热次数：第一次推理因编译/缓存会明显变慢，不计入统计
  warmup_iters: 3
  # 主界面打开相机之后，在后台把模型加载并预热。
  # 开始串流时如果这一步已经完成，就只启动采集线程和推理线程。
  preload: true

# =============================================================================
# 点云
# =============================================================================
pointcloud:
  zmin_m: 0.15             # 与 depth.zmin_m 独立，便于单独调点云范围
  zmax_m: 3.00
  # 体素下采样边长；0 = 不下采样。
  # 【为什么实时默认关掉】实测：对 51.8 万点做 5mm 体素下采样需要约 59 ms，
  #   在实时循环里会明显拖慢帧率（FFS 推理本身才 43~157 ms）。
  #   实时显示靠下面的 max_points 做保护即可；需要下采样时用命令行开启，例如：
  #       python main.py --mode pointcloud --voxel 0.005
  voxel_size_m: 0.0
  use_color: true          # 用左图给点云着色
  # truecolor：每个点直接取左相机对应像素，和二维彩色是同一套颜色。
  # model：改用推理时的 RGB 小图（会再交换一次通道，蓝色容易变成红色）。
  color_mode: truecolor
  color_source: left
  max_points: 400000       # 上采样上限保护，防止点数爆炸拖垮显示

# =============================================================================
# 运行时 / 显示
# =============================================================================
runtime:
  window_name: "Stereo Viewer"
  display_scale: 1.0       # 显示窗口缩放；1.0 = 原始大小
  status_every_n_frames: 30
  # ---- 阶段 7.2：三线程流水线（采集 / 推理 解耦）----
  # true  = 采集与推理放后台线程，画面按"最新帧"刷新（20~30 FPS），视差按推理速度更新
  #         实测分阶段（tools/bench_pipeline.py）：推理 164 ms、点云 23 ms、显示 12 ms
  #         串行 5.01 FPS -> 三线程估计 6.04 FPS，且画面手感明显更顺
  #         ⚠️ 视差会比画面滞后一点点，这是解耦的正常现象（不是 bug）
  # false = 原单线程串行路径（行为与之前完全一致）
  # 命令行 --threaded on/off 可临时覆盖本开关（目前只接入了 --mode depth）
  threaded: true
  # 保存目录（相对项目根目录，均为程序生成的数据，不入库）
  save_dir: output
  save_raw: true           # 保存左右原始图像
  save_rectified: true     # 保存校正后图像（阶段 5 之后才有意义）
  save_disparity: true
  save_depth: true
  save_pointcloud: true

# =============================================================================
# GUI（tools/calib_gui.py，标定工作台）—— 只影响界面，命令行链路不读这一节
# =============================================================================
gui:
  # 预览分析帧率上限。一次 ChArUco 分析约 100 ms，是采集时的主要 CPU 来源；
  # 调到 5~6 更省电、整机更跟手，调到 10~12 画面更顺但更吃 CPU。
  # 0 = 不限制（分析完立刻读下一帧，CPU 最高）。
  preview_fps: 8

  # OpenCV 线程池大小。实测 analyze_pair 用 1 线程与 24 线程耗时相同
  # （107.8 vs 108.1 ms），但 24 线程要多烧约 0.5 个核；光标发涩/风扇吵就保持 1。
  cv_threads: 1

# =============================================================================
# 界面语言（app_entry 与主界面读取；命令行 --lang 可临时覆盖）
# =============================================================================
ui:
  language: zh        # zh = 中文，en = English
